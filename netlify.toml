[build]
  command = "npm install && npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"
  included_files = ["backend/sample_villages.csv", "backend/raw_villages.csv", "backend/safe_sites.csv", "backend/data/historical/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
